<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Nebula — 螺旋星尘</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  #c { display:block; width:100vw; height:100vh; }
  .hint { position:fixed; left:12px; top:12px; color:#666; font:11px sans-serif; pointer-events:none; z-index:9; }

/* ============================================================
   底部横向胶囊毛玻璃播放控制条
   全部可调参数集中在这里（颜色 / 模糊 / 尺寸）
   ============================================================ */
:root{
  /* 外壳 */
  --capsule-bg:      rgba(20,20,28,0.32);   /* 深色半透明底 */
  --capsule-blur:    14px;                  /* 磨砂玻璃模糊强度 */
  --capsule-border:  #ffffff3a;             /* 极细浅白描边 */
  --capsule-radius:  999px;                 /* 大圆角横向胶囊 */
  --capsule-width:   min(1180px, 94vw);     /* 控件总宽 */
  --capsule-bottom:  22px;                  /* 距页面底部 */

  /* 图标 / 文字 */
  --fg:              #dddddd;               /* 普通图标与文字统一灰白 */
  --fg-strong:       #ffffff;               /* 暂停符号纯白 */

  /* 进度条 */
  --track-bg:        rgba(255,255,255,0.18);/* 底层灰色轨道 */
  --track-fill:      #87e2dd;               /* 已播放 淡青绿 */
  --track-h:         3px;
  --track-progress:  14%;                   /* 00:22 / 02:36 ≈ 14% */

  /* 中间大暂停按钮 */
  --pause-size:      78px;                  /* 明显大于其它按钮 */
  --pause-bg:        rgba(255,255,255,0.12);
  --pause-border:    rgba(255,255,255,0.24);
  --pause-blur:      6px;
  --pause-bar-w:     6px;
  --pause-bar-h:     26px;

  /* 文字按钮小胶囊底 */
  --chip-bg:         rgba(255,255,255,0.08);

  /* 尺寸 */
  --icon-size:       24px;
  --cover-size:      56px;
  --gap:             14px;
}

/* ---------------- 胶囊外壳 ---------------- */
.player{
  position: fixed;
  left: 50%; bottom: var(--capsule-bottom);
  transform: translateX(-50%);
  z-index: 20;                       /* 压在粒子画布之上，低于调试面板 */
  width: var(--capsule-width);
  padding: 16px 32px 20px;
  box-sizing: border-box;
  border-radius: var(--capsule-radius);
  background: var(--capsule-bg);
  -webkit-backdrop-filter: blur(var(--capsule-blur)) saturate(140%);
          backdrop-filter: blur(var(--capsule-blur)) saturate(140%);
  border: 1px solid var(--capsule-border);
  box-shadow: 0 18px 50px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);
  font: 13px/1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------------- 顶部横向进度条 ---------------- */
.progress{
  height: var(--track-h);
  border-radius: 99px;
  background: var(--track-bg);
  overflow: hidden;
  margin: 2px 0 12px;
}
.progress__fill{
  height: 100%;
  width: var(--track-progress);
  border-radius: 99px;
  background: var(--track-fill);
  box-shadow: 0 0 8px rgba(135,226,221,.75);
}

/* ---------------- 控件行（严格顺序 1→15） ---------------- */
.row{
  display: flex;
  align-items: center;               /* 全部垂直居中 */
  justify-content: space-between;    /* 沿整条均匀铺开 */
  gap: var(--gap);
  white-space: nowrap;
}

/* 1. 圆角正方形专辑封面 */
.cover{
  width: var(--cover-size); height: var(--cover-size);
  border-radius: 12px;
  object-fit: cover;
  display: block; flex: 0 0 auto;
  box-shadow: 0 4px 14px rgba(0,0,0,.45);
}

/* 通用图标按钮 */
.btn{
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--icon-size); height: var(--icon-size);
  padding: 0; margin: 0;
  background: none; border: 0;
  color: var(--fg); cursor: pointer;
  transition: opacity .18s ease, transform .18s ease;
}
.btn:hover{ opacity:.75; }
.btn:active{ transform: scale(.94); }
.btn svg{ width:100%; height:100%; display:block; }

/* 2 / 12 / 13. 文字按钮 */
.btn--text{
  width: auto;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 13px; letter-spacing:.5px;
  color: var(--fg);
}
.btn--std{                            /* STD 带小胶囊底 */
  background: var(--chip-bg);
  border: 1px solid rgba(255,255,255,.10);
}
.btn--han{ font-size:16px; padding:6px 8px; }  /* 词 */

/* 8. 中间大暂停按钮：整条控件的视觉中心 */
.pause{
  flex: 0 0 auto;
  width: var(--pause-size); height: var(--pause-size);
  margin: 0 6px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  cursor: pointer;
  background: var(--pause-bg);
  border: 1px solid var(--pause-border);
  -webkit-backdrop-filter: blur(var(--pause-blur));
          backdrop-filter: blur(var(--pause-blur));
  box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
  transition: transform .18s ease, background .18s ease;
}
.pause:hover{ background: rgba(255,255,255,.18); }
.pause:active{ transform: scale(.95); }
.pause i{
  display:block;
  width: var(--pause-bar-w); height: var(--pause-bar-h);
  border-radius: 2px;
  background: var(--fg-strong);
}

/* 15. 最右侧时间 */
.time{
  flex: 0 0 auto;
  font-size: 13px; color: var(--fg);
  font-variant-numeric: tabular-nums; letter-spacing:.3px;
}

/* 窄屏兜底 */
@media (max-width: 900px){
  :root{ --icon-size:18px; --cover-size:42px; --pause-size:60px; --gap:10px; --pause-bar-h:20px; --pause-bar-w:5px; }
  .player{ padding: 8px 16px 12px; }
}

/* ============================================================
   右上角：圆形房子按钮 + 用户胶囊（头像 + 昵称）
   复用同一套毛玻璃变量；仅房子图标用强调色
   ============================================================ */
:root{
  --accent:        #87e2dd;                 /* 房子图标 青色（与进度条同色系） */
  --top-btn-size:  46px;                    /* 圆形按钮直径 */
  --top-avatar:    38px;                    /* 头像直径 */
  --top-gap:       12px;                    /* 两个控件间距 */
  --top-offset-y:  18px;                    /* 距顶部 */
  --top-offset-x:  20px;                    /* 距右侧 */
  --top-name-size: 15px;                    /* 昵称字号 */
}

.topbar{
  position: fixed;
  top: var(--top-offset-y);
  right: var(--top-offset-x);
  z-index: 20;                              /* 与底部控制条同层，低于调试面板 */
  display: flex;
  align-items: center;
  gap: var(--top-gap);
  font: 13px/1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 圆形房子按钮 */
.topbar__home{
  width: var(--top-btn-size); height: var(--top-btn-size);
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; cursor: pointer;
  color: var(--accent);
  background: var(--capsule-bg);
  -webkit-backdrop-filter: blur(var(--capsule-blur)) saturate(140%);
          backdrop-filter: blur(var(--capsule-blur)) saturate(140%);
  border: 1px solid var(--capsule-border);
  box-shadow: 0 8px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07);
  transition: transform .18s ease, opacity .18s ease;
}
.topbar__home:hover{ opacity:.8; }
.topbar__home:active{ transform: scale(.94); }
.topbar__home svg{ width: 24px; height: 24px; display:block; }

/* 用户胶囊：头像 + 昵称 */
.topbar__user{
  height: var(--top-btn-size);
  display: inline-flex; align-items: center;
  gap: 10px;
  padding: 0 20px 0 5px;
  border-radius: 999px;
  background: var(--capsule-bg);
  -webkit-backdrop-filter: blur(var(--capsule-blur)) saturate(140%);
          backdrop-filter: blur(var(--capsule-blur)) saturate(140%);
  border: 1px solid var(--capsule-border);
  box-shadow: 0 8px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07);
  cursor: pointer;
  transition: opacity .18s ease;
}
.topbar__user:hover{ opacity:.85; }
.topbar__avatar{
  width: var(--top-avatar); height: var(--top-avatar);
  border-radius: 50%;
  object-fit: cover;
  display: block;
  flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.18);
}
.topbar__name{
  font-size: var(--top-name-size);
  color: var(--fg);
  letter-spacing: .5px;
  white-space: nowrap;
}

@media (max-width: 900px){
  :root{ --top-btn-size:38px; --top-avatar:31px; --top-name-size:13px; }
  .topbar__home svg{ width:20px; height:20px; }
}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">H 显示/隐藏调试面板</div>

( function () {

	/**
 * Luminosity
 * http://en.wikipedia.org/wiki/Luminosity
 */

	const LuminosityHighPassShader = {
		shaderID: 'luminosityHighPass',
		uniforms: {
			'tDiffuse': {
				value: null
			},
			'luminosityThreshold': {
				value: 1.0
			},
			'smoothWidth': {
				value: 1.0
			},
			'defaultColor': {
				value: new THREE.Color( 0x000000 )
			},
			'defaultOpacity': {
				value: 0.0
			}
		},
		vertexShader:
  /* glsl */
  `

		varying vec2 vUv;

		void main() {

			vUv = uv;

			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,
		fragmentShader:
  /* glsl */
  `

		uniform sampler2D tDiffuse;
		uniform vec3 defaultColor;
		uniform float defaultOpacity;
		uniform float luminosityThreshold;
		uniform float smoothWidth;

		varying vec2 vUv;

		void main() {

			vec4 texel = texture2D( tDiffuse, vUv );

			vec3 luma = vec3( 0.299, 0.587, 0.114 );

			float v = dot( texel.xyz, luma );

			vec4 outputColor = vec4( defaultColor.rgb, defaultOpacity );

			float alpha = smoothstep( luminosityThreshold, luminosityThreshold + smoothWidth, v );

			gl_FragColor = mix( outputColor, texel, alpha );

		}`
	};

	THREE.LuminosityHighPassShader = LuminosityHighPassShader;

} )();

<script>/* === UnrealBloomPass.js (inlined) === */

 * UnrealBloomPass is inspired by the bloom pass of Unreal Engine. It creates a

			this.fsQuad.material = this.materialCopy;

				varying vec2 vUv;
				uniform sampler2D colorTexture;

					'blurTexture4': {

				}`

( function () {

	/**
 * Afterimage shader
 * I created this effect inspired by a demo on codepen:
 * https://codepen.io/brunoimbrizi/pen/MoRJaN?page=1&
 */
	const AfterimageShader = {
		uniforms: {
			'damp': {
				value: 0.96
			},
			'tOld': {
				value: null
			},
			'tNew': {
				value: null
			}
		},
		vertexShader:
  /* glsl */
  `

		varying vec2 vUv;

		void main() {

			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,
		fragmentShader:
  /* glsl */
  `

		uniform float damp;

		uniform sampler2D tOld;
		uniform sampler2D tNew;

		varying vec2 vUv;

		vec4 when_gt( vec4 x, float y ) {

			return max( sign( x - y ), 0.0 );

		}

		void main() {

			vec4 texelOld = texture2D( tOld, vUv );
			vec4 texelNew = texture2D( tNew, vUv );

			texelOld *= damp * when_gt( texelOld, 0.1 );

			gl_FragColor = max(texelNew, texelOld);

		}`

// 背景布局：竖向 100% 撑满（上下铺满、不变形），水平居中；左右按比例可能留黑
function layoutBg() {
  const iw = (bgTex.image && bgTex.image.width)  || 1;
  const ih = (bgTex.image && bgTex.image.height) || 1;
  const sa = window.innerWidth / window.innerHeight;   // 屏幕宽高比
  const ia = iw / ih;                                  // 图片宽高比
  // 上下撑满：图片高度 = 屏幕高度；宽度按原比例换算
  let sy = 1, sx = ia / sa;
  const z = PARAMS.BG.scale;   // 统一缩放（1.0 = 上下正好撑满）
  bgMesh.scale.set(sx * z, sy * z, 1);
  // 定位：posX/posY 为 0~1 的屏幕比例（0.5 = 居中）
  bgMesh.position.x = PARAMS.BG.posX * 2 - 1;
  bgMesh.position.y = 1 - PARAMS.BG.posY * 2;
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 2000);

const vs = `
  uniform float uTime;
  uniform float uIntensity;
  uniform float uSpeed;
  uniform float uDepth;
  uniform float uColorBoost;
  uniform float uPointScale;
  uniform float uParticleDim;
  uniform float uPixelRatio;
  uniform float uDofNear;
  uniform float uDofRange;

  attribute vec3  aHome;
  attribute vec3  aColor;
  attribute float aRand;
  attribute float aBright;
  attribute float aPhase;

  varying vec3  vColor;
  varying float vBright;
  varying float vAlpha;
  varying float vSoft;

  void main() {
    float r   = length(aHome.xy);
    float ang = atan(aHome.y, aHome.x);

    // 差速旋转：内圈快、外圈慢 → 螺旋臂缓慢流动
    float omega = uSpeed * (1.0 / (r * 0.07 + 0.7));
    ang -= uTime * omega * uIntensity;   // 反向旋转（与原始方向相反）

    vec2 xy = r * vec2(cos(ang), sin(ang));
    float z = aHome.z + sin(uTime * 0.4 + r * 0.18 + aPhase) * uDepth * 1.1;
    vec3 pos = vec3(xy, z);

    // 左侧密度弧增亮
    float sideBoost = 0.45 + 0.55 * smoothstep(30.0, -32.0, pos.x);
    float twinkle = 0.8 + 0.2 * sin(uTime * (0.6 + aRand * 1.8) + aPhase);

    vColor  = aColor * uColorBoost;
    vBright = (0.45 + 0.65 * aBright) * uColorBoost * sideBoost * twinkle;
    vAlpha  = 0.72 * uParticleDim;

    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    float dist = max(-mvPosition.z, 1.0);
    gl_Position = projectionMatrix * mvPosition;

    float dof = clamp((uDofNear - dist) / uDofRange, 0.0, 1.0);
    vSoft = dof;

    float baseSize = (0.50 + aRand * 0.75) * uPointScale;
    float size = baseSize * (1.0 + dof * 3.0);
    gl_PointSize = clamp(size * uPixelRatio * (50.0 / dist), 1.2, 36.0 * uPixelRatio);
  }
`;

const fs = `
  precision mediump float;
  varying vec3  vColor;
  varying float vBright;
  varying float vAlpha;
  varying float vSoft;

  void main() {
    vec2 c = gl_PointCoord - vec2(0.5);
    float d = length(c);
    if (d > 0.5) discard;

    float kCore = 11.0 - 8.0 * vSoft;
    float kHalo = 3.2 - 2.2 * vSoft;
    float core = exp(-d * d * kCore);
    float halo = exp(-d * d * kHalo);
    float a = (core * (0.55 + 0.35 * vSoft) + halo * (0.26 + 0.30 * vSoft)) * vAlpha;

    vec3 col = vColor * vBright;
    gl_FragColor = vec4(col, a);
  }
`;

const geometry = new THREE.BufferGeometry();
const positions = [], aColor = [], aRand = [], aBright = [], aPhase = [];

const { count, rMin, rMax, arms, wind } = PARAMS.DISC;

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

for (let i = 0; i < count; i++) {
  // 半径：45% 集中在盘环（左侧密度弧），其余铺满盘面
  const t = Math.random();
  let r;
  if (Math.random() < 0.45) {
    r = rMax * 0.78 + gauss() * 5.5;
    r = Math.max(rMin, Math.min(rMax, r));
  } else {
    r = rMin + (rMax - rMin) * Math.pow(t, 0.55);
  }

  const arm = i % arms;
  const branch = (arm / arms) * Math.PI * 2.0;
  const spiral = r * wind;
  const scatter = gauss() * (0.5 + r * 0.05);
  const ang = branch + spiral + scatter * 0.09;

  const x = Math.cos(ang) * r + gauss() * (0.25 + r * 0.018);
  const y = Math.sin(ang) * r + gauss() * (0.25 + r * 0.018);
  const z = gauss() * (0.7 + 2.4 * Math.exp(-r * 0.05));

  positions.push(x, y, z);
  aRand.push(Math.random());
  aPhase.push(Math.random() * Math.PI * 2);

  const coreGlow = Math.exp(-r * 0.055);
  aBright.push(Math.min(1.0, coreGlow * 0.8 + Math.random() * 0.45));

  // 白为主 + 粉紫 + 少量淡蓝
  const c = Math.random();
  let cr, cg, cb;
  if (c < 0.34) { cr = 1.00; cg = 0.62 + 0.14 * Math.random(); cb = 0.80 + 0.14 * Math.random(); }
  else if (c < 0.86) { cr = 1.00; cg = 0.96 + 0.03 * Math.random(); cb = 0.98; }
  else { cr = 0.76 + 0.06 * Math.random(); cg = 0.87 + 0.05 * Math.random(); cb = 1.00; }
  aColor.push(cr, cg, cb);
}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.setAttribute('aHome',    new THREE.Float32BufferAttribute(positions.slice(), 3));
geometry.setAttribute('aColor',   new THREE.Float32BufferAttribute(aColor, 3));
geometry.setAttribute('aRand',    new THREE.Float32BufferAttribute(aRand, 1));
geometry.setAttribute('aBright',  new THREE.Float32BufferAttribute(aBright, 1));
geometry.setAttribute('aPhase',   new THREE.Float32BufferAttribute(aPhase, 1));

const uniforms = {
  uTime:        { value: 0 },
  uIntensity:   { value: PARAMS.uIntensity },
  uSpeed:       { value: PARAMS.uSpeed },
  uDepth:       { value: PARAMS.uDepth },
  uColorBoost:  { value: PARAMS.uColorBoost },
  uParticleDim: { value: PARAMS.uParticleDim },
  uPointScale:  { value: PARAMS.uPointScale },
  uPixelRatio:  { value: renderer.getPixelRatio() },
  uDofNear:     { value: PARAMS.DOF.near },
  uDofRange:    { value: PARAMS.DOF.range }
};

const material = new THREE.ShaderMaterial({
  uniforms, vertexShader: vs, fragmentShader: fs,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(geometry, material);
particles.rotation.x = -PARAMS.DISC.tilt;
particles.rotation.z = 0.035;
particles.position.y = PARAMS.POS.y;
scene.add(particles);

// ---------- 后期：动态模糊 + 辉光 + 最终加色合成（保住背景） ----------
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const afterimage = new THREE.AfterimagePass(PARAMS.AFTERIMG.damp);
composer.addPass(afterimage);
const bloom = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  PARAMS.BLOOM.strength, PARAMS.BLOOM.radius, PARAMS.BLOOM.threshold
);
composer.addPass(bloom);

// 最后一层：把粒子结果「加色」叠到已画好的人像背景上（黑区不影响背景）
const finalPass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }'
});
finalPass.material.blending = THREE.AdditiveBlending;
finalPass.material.transparent = true;
finalPass.material.depthTest = false;
finalPass.material.depthWrite = false;
composer.addPass(finalPass);

// ----------------------- 调试面板 -----------------------
(function makePanel(){
  const panel = document.createElement('div');
  panel.id = 'panel';
  panel.style.cssText = 'position:fixed;right:10px;top:84px;width:300px;background:rgba(0,0,0,0.85);color:#eee;font:12px monospace;padding:12px;border:1px solid #333;border-radius:6px;display:none;z-index:99;';
  const rows = [
    ['uIntensity','uIntensity',0,2,0.01],
    ['uPointScale','uPointScale',0,3,0.01],
    ['uSpeed','uSpeed',0,2,0.01],
    ['uDepth','uDepth',0,2,0.01],
    ['uColorBoost','uColorBoost',0,2,0.01],
    ['uParticleDim','uParticleDim',0,2,0.01],
    ['bloomStr','BLOOM.strength',0,2,0.01],
    ['bloomTh','BLOOM.threshold',0,1,0.01],
    ['bloomRad','BLOOM.radius',0,1,0.01],
    ['trail','AFTERIMG.damp',0,0.96,0.01],
    ['dofNear','DOF.near',5,90,0.5],
    ['dofRange','DOF.range',5,80,0.5],
    ['tilt','DISC.tilt',0,1.57,0.01],
    ['posY','POS.y',-15,15,0.1],
    ['bgScale','BG.scale',0.1,1.5,0.01],
    ['bgPosX','BG.posX',0,1,0.01],
    ['bgPosY','BG.posY',0,1,0.01]
  ];
  rows.forEach(([id, key, min, max, step]) => {
    const parts = key.split('.');
    const val = parts.length===1 ? PARAMS[parts[0]] : PARAMS[parts[0]][parts[1]];
    const wrap = document.createElement('div'); wrap.style.marginBottom='7px';
    const label = document.createElement('label');
    label.textContent = key + ': '; label.style.cssText='display:inline-block;width:118px;';
    const num = document.createElement('span'); num.style.cssText='width:40px;display:inline-block;'; num.textContent=val.toFixed(2);
    const input = document.createElement('input');
    input.type='range'; input.min=min; input.max=max; input.step=step; input.value=val; input.style.width='96px';
    input.oninput = () => {
      const v = parseFloat(input.value); num.textContent=v.toFixed(2);
      if (parts.length===1) PARAMS[parts[0]] = v; else PARAMS[parts[0]][parts[1]] = v;
      if (parts[0]==='BG') layoutBg();
    };
    wrap.append(label, num, input); panel.appendChild(wrap);
  });
  document.body.appendChild(panel);
  let vis = false;
  document.addEventListener('keydown', e => {
    if (e.key==='h'||e.key==='H'){ vis=!vis; panel.style.display = vis?'block':'none'; }
  });
})();

// ----------------------- 动画循环 -----------------------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  clock.getDelta();
  const t = clock.elapsedTime;

  /* 【外部可在此处覆盖参数】
     接音乐时：PARAMS.uIntensity = 你的低频归一化值; */

  uniforms.uIntensity.value   = PARAMS.uIntensity;
  uniforms.uPointScale.value  = PARAMS.uPointScale;
  uniforms.uSpeed.value       = PARAMS.uSpeed;
  uniforms.uDepth.value       = PARAMS.uDepth;
  uniforms.uColorBoost.value  = PARAMS.uColorBoost;
  uniforms.uParticleDim.value = PARAMS.uParticleDim;
  uniforms.uDofNear.value     = PARAMS.DOF.near;
  uniforms.uDofRange.value    = PARAMS.DOF.range;
  uniforms.uTime.value = t;

  particles.rotation.x = -PARAMS.DISC.tilt;
  particles.position.y = PARAMS.POS.y;

  afterimage.uniforms.damp.value = PARAMS.AFTERIMG.damp;
  bloom.strength  = PARAMS.BLOOM.strength;
  bloom.threshold = PARAMS.BLOOM.threshold;
  bloom.radius    = PARAMS.BLOOM.radius;

  // 1) 清屏并画背景人像
  renderer.autoClear = true;
  renderer.render(bgScene, bgCamera);
  // 2) 粒子后期加色叠上去
  renderer.autoClear = false;
  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
  uniforms.uPixelRatio.value = renderer.getPixelRatio();
  layoutBg();
});

animate();

</script>
